# E5 rerun: MobileCLIP-S2 with EXACTLY the E1-E4 recipe (16000-iteration stage 2).
#
# Byte-for-byte copy of encoder_experiments.yaml (same data, decoder, MLP2
# projection, optimizer, stage 1 warmup, stage 2 length/schedule, seed,
# frozen-encoder policy -- see that file's header) except:
#   - save_dir (separate output root, never mixes with E1-E4 or the 12k E5),
#   - the experiments list holds only E5 = MobileCLIP-S2.
# The earlier 12000-iteration E5 run (encoder_experiments_extra.yaml) is kept
# unchanged so its results stay reproducible.

save_dir: experiments_s2_16k
seed: 42
gpu: 0
num_workers: 8

model:
  image_size: 256
  bert: dbmdz/bert-base-turkish-cased
  max_length: 35
  proj: true
  proj_num_head: ~
  proj_type: mlp2

data:
  train_dataset_name: tasvir-et
  train_dataset_root: Data/flickr8k/images
  train_json_path: Data/tasvir-et/tasvir_train.json
  test_dataset_name: tasvir-et
  test_dataset_root: Data/flickr8k/images
  val_json_path: Data/tasvir-et/tasvir_val.json
  test_json_path: Data/tasvir-et/tasvir_test.json

# Stage 1: projection warmup (values from MC0 mobileclip_s2_stage1.yaml).
stage1:
  freeze_decoder: true
  strict_init: true
  lr: 1e-5            # unused: decoder frozen
  lr_proj: 1e-4
  betas: [0.9, 0.99]
  weight_decay: 0.01
  batch_size: 96
  max_iter: 250
  warm_up_iter: 25
  scheduler_total_iter: 250
  num_eval_iter: 125
  checkpoint_iters: [250]
  target_metric: CIDEr

# Stage 2: main training (values from MC0 mobileclip_s2_stage2.yaml, except
# max_iter 50000 -> 16000 with the linear decay now ending at 16000).
stage2:
  freeze_decoder: false
  strict_init: true
  lr: 1e-5
  lr_proj: 5e-5
  betas: [0.9, 0.99]
  weight_decay: 0.01
  batch_size: 64
  max_iter: 16000
  warm_up_iter: 2000
  scheduler_total_iter: 16000
  num_eval_iter: 4000
  checkpoint_iters: [4000, 8000, 12000, 16000]
  target_metric: CIDEr

experiments:
  - id: E5
    name: MobileCLIP_S2
    display_name: MobileCLIP-S2
    encoder: mobileclip_s2
    pretrained_ckpt: checkpoints/mobileclip_s2.pt
    pretrained_source: https://docs-assets.developer.apple.com/ml-research/datasets/mobileclip/mobileclip_s2.pt
