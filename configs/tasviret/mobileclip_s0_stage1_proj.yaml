seed: 42
gpu: 0
save_dir: experiments
save_name: mobileclip_s0_stage1_proj_tasviret
overwrite: ~

# Same as mobileclip_s0_stage1.yaml, except the projection: this variant
# uses the baseline's Transformer+Linear `Proj` (proj_num_head set, no
# proj_type) instead of the 2-layer MLP `MlpProj` (proj_type: mlp2). Kept
# as a fully separate config/save_name so it never collides with (or
# requires stopping) the mlp2 run in mobileclip_s0_stage1.yaml /
# mobileclip_s0_stage2.yaml -- both are meant to be run and compared as
# independent experiments. `Proj` needs no code/dimension changes for
# MobileCLIP S0: its 1024-dim raw feature output happens to match
# DINOv2 ViT-L/14's hidden size, which `Proj`/`proj_num_head` were
# originally sized for (verified locally: constructs and trains cleanly,
# see devam.md).
init_model_ckpt: ~
strict_init: true
resume: ~

# Freeze the language decoder entirely; only the projection is trained
# this stage. See trainer.py's freeze_decoder handling.
freeze_decoder: true

# model
model:
  mobileclip: mobileclip_s0
  mobileclip_ckpt: checkpoints/mobileclip_s0.pt
  image_size: 256
  bert: dbmdz/bert-base-turkish-cased
  max_length: 35
  proj: true
  proj_num_head: 16
  # proj_type intentionally omitted (not mlp2) -> routes to the
  # Transformer+Linear `Proj` class in Model/TRCaptionNet.py.

# optimizer
# NOTE: hyperparameters below are placeholders to get stage 1 running
# end-to-end; a dedicated hyperparameter pass is planned once all 3 encoder
# sizes are confirmed to train without errors (see devam.md).
lr: 1e-5  # unused: decoder is frozen this stage, kept only so trainer.py has a value to log
lr_proj: 1e-4
betas: [0.9, 0.99]
weight_decay: 0.01

num_workers: 8
batch_size: 128
# TasvirEt train split has 12028 (image, caption) pairs -> 1 epoch = ~94
# iterations at batch_size=128. max_iter=200 targets ~2 epochs, matching
# plan.md's "1-2 epoch" warmup goal.
max_iter: 200
warm_up_iter: 20
num_eval_iter: 100
target_metric: 'Bleu_4' # Bleu_1 Bleu_2 Bleu_3 Bleu_4 METEOR ROUGE_L CIDEr SPICE

# dataset
train_dataset_name: tasvir-et
train_dataset_root: Data/flickr8k/images
train_json_path: Data/tasvir-et/tasvir_train.json

test_dataset_name: tasvir-et
test_dataset_root: Data/flickr8k/images
val_json_path: Data/tasvir-et/tasvir_val.json
