seed: 42
gpu: 0
save_dir: experiments
save_name: mobileclip_s0_stage2_en_tasviret
overwrite: ~

# Stage 2 of the English-caption language-isolation control experiment --
# see mobileclip_s0_stage1_en.yaml for the full rationale. Continues from
# that stage's warmed-up mlp2 projection.
init_model_ckpt: experiments/mobileclip_s0_stage1_en_tasviret/model_last.pth
strict_init: true
resume: ~

freeze_decoder: false

# model
model:
  mobileclip: mobileclip_s0
  mobileclip_ckpt: checkpoints/mobileclip_s0.pt
  image_size: 256
  bert: bert-base-uncased  # English decoder init (was dbmdz/bert-base-turkish-cased)
  max_length: 35
  proj: true
  proj_num_head: ~
  proj_type: mlp2

# optimizer -- identical to mobileclip_s0_stage2.yaml (and the baseline),
# so this stays a clean, apples-to-apples language-only comparison.
lr: 1e-5
lr_proj: 5e-5
betas: [0.9, 0.99]
weight_decay: 0.01

num_workers: 8
batch_size: 64
max_iter: 50000
warm_up_iter: 2000
num_eval_iter: 4000
target_metric: 'Bleu_4'

# dataset -- English Flickr8k (Karpathy split), same images as TasvirEt
train_dataset_name: tasvir-et
train_dataset_root: Data/flickr8k/images
train_json_path: Data/flickr8k-en/flickr8k_train.json

test_dataset_name: tasvir-et
test_dataset_root: Data/flickr8k/images
val_json_path: Data/flickr8k-en/flickr8k_val.json
