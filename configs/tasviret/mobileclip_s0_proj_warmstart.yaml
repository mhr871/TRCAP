seed: 42
gpu: 0
save_dir: experiments
save_name: mobileclip_s0_proj_warmstart_tasviret
overwrite: ~

# Experiment 3: same architecture as mobileclip_s0_stage2_proj.yaml (MobileCLIP
# S0 + Proj), but proj+decoder start "warm" from the already-caption-trained
# checkpoints/TRCaptionNetpp_Large.pth instead of "cold" from a generic
# Turkish BERT. No separate Stage 1 needed here (unlike the mlp2/proj cold-start
# configs): proj+decoder are already trained, not randomly initialized, so
# there is nothing to warm up -- this goes straight to a single fine-tune
# stage, mirroring how configs/tasviret/tasviretpp_large_tasviret.yaml (the
# baseline) also has no separate warmup stage for the same reason.
#
# strict_init MUST be false: TRCaptionNetpp_Large.pth's vision_encoder is
# DINOv2 ViT-L/14, architecturally incompatible with MobileCLIP S0 (different
# module names/shapes throughout), so those keys can never match. With
# strict_init: false, trainer.py's `model.load_state_dict(state_dict,
# strict=False)` simply leaves the encoder alone -- vision_encoder already
# holds its own correct MobileCLIP weights (loaded separately via
# model.mobileclip_ckpt during TRCaptionNetpp construction, which always runs
# BEFORE init_model_ckpt is applied, see trainer.py's __call__) -- while
# proj.* and language_decoder.* (cross-attention included) load in full: only
# vision_encoder.* keys end up in missing_keys/unexpected_keys. Verified
# locally end to end (construction -> non-strict load -> forward/backward
# with the decoder unfrozen -> generate()) before committing this config; see
# devam.md. strict_init: true here would crash immediately on the
# vision_encoder shape mismatch -- do not change this to true.
init_model_ckpt: checkpoints/TRCaptionNetpp_Large.pth
strict_init: false
resume: ~

# Decoder starts unfrozen: it's already trained, there is nothing to protect
# it from vs. a randomly-initialized projection (also already trained here).
freeze_decoder: false

# model
model:
  mobileclip: mobileclip_s0
  mobileclip_ckpt: checkpoints/mobileclip_s0.pt
  image_size: 256
  # NOTE: this HF id is only used to build a decoder of the RIGHT SHAPE
  # (vocab_size=32000, hidden=768, 12 layers -- verified to exactly match
  # TRCaptionNetpp_Large.pth's decoder geometry) so the subsequent
  # init_model_ckpt load lands on matching keys/shapes. Its own pretrained
  # values are immediately overwritten by init_model_ckpt above; swapping it
  # for a differently-shaped checkpoint here would break the warm-start load.
  bert: dbmdz/bert-base-turkish-cased
  max_length: 35
  proj: true
  proj_num_head: 16
  # proj_type intentionally omitted (not mlp2) -> routes to the
  # Transformer+Linear `Proj` class, matching TRCaptionNetpp_Large.pth's
  # proj.* shapes exactly (verified: 0 missing/mismatched proj.* keys).

# optimizer
# Identical schedule to mobileclip_s0_stage2.yaml / mobileclip_s0_stage2_proj.yaml
# (and to the baseline tasviretpp_large_tasviret.yaml) so all experiments stay
# a clean, apples-to-apples comparison -- only the projection architecture and
# proj/decoder starting weights differ between the three MobileCLIP S0 runs.
lr: 1e-5
lr_proj: 5e-5
betas: [0.9, 0.99]
weight_decay: 0.01

num_workers: 8
batch_size: 64
max_iter: 50000
warm_up_iter: 2000
num_eval_iter: 4000
target_metric: 'Bleu_4' # Bleu_1 Bleu_2 Bleu_3 Bleu_4 METEOR ROUGE_L CIDEr SPICE

# dataset
train_dataset_name: tasvir-et
train_dataset_root: Data/flickr8k/images
train_json_path: Data/tasvir-et/tasvir_train.json

test_dataset_name: tasvir-et
test_dataset_root: Data/flickr8k/images
val_json_path: Data/tasvir-et/tasvir_val.json
