seed: 42
gpu: 0
save_dir: experiments
save_name: mobileclip_s0_stage2_proj_tasviret
overwrite: ~

# Stage 2 (main fine-tune) for the `Proj` (baseline-style, Transformer+Linear)
# projection variant -- continues from mobileclip_s0_stage1_proj.yaml's
# warmed-up Proj, NOT from the mlp2 run's checkpoint (different proj
# architecture, incompatible state_dict). See mobileclip_s0_stage1_proj.yaml
# for why this exists as a separate experiment/save_name from the mlp2 one.
init_model_ckpt: experiments/mobileclip_s0_stage1_proj_tasviret/model_last.pth
strict_init: true
resume: ~

# Decoder unfrozen; projection + language decoder train together. Encoder
# stays frozen regardless (see Model/mobileclip/mobileclip_encoder.py).
freeze_decoder: false

# model
model:
  mobileclip: mobileclip_s0
  mobileclip_ckpt: checkpoints/mobileclip_s0.pt
  image_size: 256
  bert: dbmdz/bert-base-turkish-cased
  max_length: 35
  proj: true
  proj_num_head: 16
  # proj_type intentionally omitted (not mlp2) -> routes to the
  # Transformer+Linear `Proj` class in Model/TRCaptionNet.py.

# optimizer
# Identical schedule to mobileclip_s0_stage2.yaml (the mlp2 run) so the two
# are a clean, apples-to-apples ablation of only the projection module.
lr: 1e-5
lr_proj: 5e-5
betas: [0.9, 0.99]
weight_decay: 0.01

num_workers: 8
batch_size: 64
max_iter: 50000
warm_up_iter: 2000
num_eval_iter: 4000
target_metric: 'Bleu_4' # Bleu_1 Bleu_2 Bleu_3 Bleu_4 METEOR ROUGE_L CIDEr SPICE

# dataset
train_dataset_name: tasvir-et
train_dataset_root: Data/flickr8k/images
train_json_path: Data/tasvir-et/tasvir_train.json

test_dataset_name: tasvir-et
test_dataset_root: Data/flickr8k/images
val_json_path: Data/tasvir-et/tasvir_val.json
