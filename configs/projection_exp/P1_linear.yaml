seed: 42
gpu: 0
save_dir: experiments
save_name: P1_linear
overwrite: ~

init_model_ckpt: ~
strict_init: true
resume: ~

# Encoder frozen, decoder TRAINABLE (freeze_decoder: false) -- unlike
# proj_exp (Model/projection_adapters + freeze_decoder: true, decoder
# frozen so only the adapter is the independent variable), every P1-P7
# experiment here also fine-tunes the full BERTurk decoder jointly with
# the projection adapter, exactly like the reference
# configs/tasviret/mobileclip_s2_stage2.yaml (~5.3 it/s) run. Only
# `proj_type` differs across the P1-P7 configs; everything else (encoder,
# dataset, hyperparameters) is identical to proj_exp.
freeze_decoder: false

model:
  mobileclip: mobileclip_s2
  mobileclip_ckpt: checkpoints/mobileclip_s2.pt
  image_size: 256
  bert: dbmdz/bert-base-turkish-cased
  max_length: 35
  proj: true
  proj_num_head: ~
  proj_type: linear   # P1 -- Linear Projection (Model/projection_adapters/linear.py)
  projection_adapter_kwargs: {}

lr: 1e-5
lr_proj: 5e-5
betas: [0.9, 0.99]
weight_decay: 0.01

num_workers: 8
batch_size: 64
max_iter: 16000
warm_up_iter: 2000
num_eval_iter: 4000
target_metric: 'CIDEr'   # Bleu_1 Bleu_2 Bleu_3 Bleu_4 ROUGE_L CIDEr (METEOR disabled, see eval.py)

train_dataset_name: tasvir-et
train_dataset_root: Data/flickr8k/images
train_json_path: Data/tasvir-et/tasvir_train.json

test_dataset_name: tasvir-et
test_dataset_root: Data/flickr8k/images
val_json_path: Data/tasvir-et/tasvir_val.json
test_json_path: Data/tasvir-et/tasvir_test.json
